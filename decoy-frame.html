<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <title>🔒 Protected View Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #090d16;
      color: #facc15;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .header-bar {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .badge {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.4);
      color: #fde047;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 10px;
    }
    .view-container {
      flex: 1;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 2px dashed rgba(234, 179, 8, 0.35);
      border-radius: 14px;
      background: #050811;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="color: #eab308;">🔒</span>
      <span style="color: #ffffff;">Secure View Frame (Recursive Protected Layer)</span>
    </div>
    <span class="badge">Inspection Blocked</span>
  </div>

  <div class="view-container">
    <iframe src="decoy-frame.html" loading="lazy" title="Protected Inner Frame"></iframe>
  </div>

  <script>
    // Disable right click and devtools in decoy frame
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'i' || e.key === 'j'))) {
        e.preventDefault();
        return false;
      }
    }, true);
    // Anti-inspect debugger trap
    setInterval(function() {
      (function() { return false; }["constructor"]("debugger")());
    }, 150);
  </script>
</body>
</html>
